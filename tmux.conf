# ==========================
# Prefix / Key Bindings
# ==========================

# Use backtick (`) as the prefix key instead of Ctrl-b
unbind C-b
set -g prefix `

# Double-tap ` to switch to the last active window
bind-key ` last-window

# Press prefix + e to send a literal backtick to the terminal
bind-key e send-prefix

# Use vi-style keys in copy mode and menus
setw -g mode-keys vi

# ==========================
# General Settings
# ==========================

# Reduce delay after pressing Escape (ms) -- helps with vim/neovim
set -sg escape-time 10

# Keep 5000 lines of scrollback history per pane
set-option -g history-limit 5000

# Default shell
set-option -g default-command "/bin/bash"

# Enable mouse support (scrolling, pane selection, resizing)
set -g mouse on

# ==========================
# Window & Pane Numbering
# ==========================

# Start window and pane indices at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# ==========================
# Status Bar
# ==========================

# Position the status bar at the bottom of the screen
set -g status-position bottom

# Status bar colours
set -g status-bg colour234
set -g status-fg colour137

# Left side: empty
set -g status-left ''
set -g status-left-length 20

# Right side: date and time
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50

# Format for the currently active window tab
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '

# Format for inactive window tabs
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '
